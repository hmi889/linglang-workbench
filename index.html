<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#4a7c59;--primary-dk:#3a6347;--light:#7ab88a;--pale:#d4e2cf;--cream:#f5f2e8;--card:#fff;--text:#2c3e2d;--muted:#7a8a7a;--border:#e2dfd4;--shadow:0 2px 10px rgba(0,0,0,.05);--red:#e74c3c;--orange:#f39c12;--blue:#3b82f6;--card-radius:18px;--base-font:14px}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;background:var(--cream);color:var(--text);-webkit-font-smoothing:antialiased}

/* ========== 登录页 ========== */
.login-page{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--pale)}
.login-box{background:var(--card);border-radius:20px;padding:32px 28px;width:340px;box-shadow:0 4px 24px rgba(0,0,0,.08);text-align:center}
.login-box h1{font-size:22px;margin-bottom:4px}
.login-box .emoji{font-size:40px;margin-bottom:8px}
.login-box .sub{font-size:13px;color:var(--muted);margin-bottom:20px}
.login-input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:12px;font-size:14px;margin-bottom:10px;font-family:inherit;background:#fff}
.login-input:focus{outline:none;border-color:var(--primary)}
.login-btn{width:100%;padding:12px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-bottom:10px}
.login-btn:hover{background:var(--primary-dk)}
.login-switch{font-size:13px;color:var(--muted);cursor:pointer}
.login-switch a{color:var(--primary);text-decoration:none}
.login-error{color:var(--red);font-size:13px;margin-bottom:8px;min-height:18px}
.name-field{display:none}
.name-required{color:var(--red);font-size:12px;margin-top:-6px;margin-bottom:4px;text-align:left;font-weight:600}

/* ========== 主应用 ========== */
.app{display:flex;min-height:100vh}

/* 侧边栏 */
.sidebar{width:220px;background:var(--pale);position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;padding:18px 0 14px;z-index:80;transition:left .3s}
.sb-hd{text-align:center;padding:6px 16px 16px;border-bottom:1px solid rgba(0,0,0,.06);margin-bottom:10px}
.sb-hd .emoji{font-size:28px}
.sb-hd .title{font-size:15px;font-weight:700;margin-top:2px;letter-spacing:.5px}
.sb-hd .sub{font-size:11px;color:var(--muted);margin-top:2px}
.sb-hd .role-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:6px;margin-top:4px;background:#dbeafe;color:#1e40af}
.sb-hd .role-badge.manager{background:#d1fae5;color:#065f46}
.logout-link{display:block;width:100%;margin-top:10px;padding:6px 0;font-size:12px;color:var(--muted);background:none;border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .2s}
.logout-link:hover{color:var(--red);border-color:var(--red);background:#fef2f2}

/* 个性化主题 */
.theme-section{margin-bottom:18px}
.theme-label{font-size:13px;font-weight:600;margin-bottom:8px;color:var(--text)}
.theme-swatches{display:flex;gap:10px;flex-wrap:wrap}
.theme-swatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:.2s;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.theme-swatch:hover{transform:scale(1.1)}
.theme-swatch.selected{border-color:var(--text);transform:scale(1.1)}
.theme-chips{display:flex;gap:8px;flex-wrap:wrap}
.theme-chip{padding:6px 16px;border-radius:10px;border:2px solid var(--border);cursor:pointer;font-size:13px;transition:.2s;background:#fff}
.theme-chip:hover{border-color:var(--primary)}
.theme-chip.selected{border-color:var(--primary);background:var(--pale);color:var(--primary);font-weight:600}
.menu{flex:1;padding:0 12px;overflow-y:auto}
.mi{display:flex;flex-direction:column;align-items:center;padding:10px 6px;margin-bottom:4px;border-radius:12px;cursor:pointer;transition:.2s;user-select:none}
.mi:hover{background:rgba(255,255,255,.45)}
.mi.active{background:var(--light);color:#fff;box-shadow:0 2px 6px rgba(74,124,89,.2)}
.mi.active .label{color:#fff}
.mi .icon{font-size:22px;margin-bottom:3px}
.mi .label{font-size:12px;font-weight:500}

/* 移动顶栏 */
.mobile-hd{display:none;position:sticky;top:0;z-index:70;background:var(--pale);padding:10px 14px;align-items:center;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.hamburger{background:none;border:none;font-size:22px;cursor:pointer;padding:4px 8px;color:var(--text)}
.m-title{flex:1;text-align:center;font-weight:600;font-size:15px}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:75}
.overlay.show{display:block}

/* 主内容 */
.content{flex:1;margin-left:220px;padding:24px 32px;max-width:900px;min-height:100vh}
.module{display:none;animation:fadeUp .3s}
.module.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* 卡片 */
.card{background:var(--card);border-radius:var(--card-radius);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:600;margin-bottom:14px}
.card-title .emoji{font-size:18px}
.card-sub{font-size:12px;color:var(--muted);margin-bottom:12px}

/* 通用 */
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:none;border-radius:12px;padding:10px 16px;font-size:14px;font-weight:500;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:inherit}
.btn-p{background:var(--primary);color:#fff}
.btn-p:hover{background:var(--primary-dk)}
.btn-g{background:#f0ede4;color:var(--text)}
.btn-g:hover{background:#e6e2d6}
.btn-r{background:#fee2e2;color:var(--red)}
.btn-r:hover{background:#fecaca}
.btn-sm{padding:6px 12px;font-size:12px;border-radius:8px}
.input{padding:10px 14px;border:1px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;background:#fff;width:100%}
.input:focus{outline:none;border-color:var(--primary)}
.textarea{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:12px;font-size:14px;font-family:inherit;background:#fff;resize:vertical;min-height:64px}
.textarea:focus{outline:none;border-color:var(--primary)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:10px;font-size:12px;font-weight:500}
.badge-pending{background:#fef3c7;color:#92400e}
.badge-progress{background:#dbeafe;color:#1e40af}
.badge-done{background:#d1fae5;color:#065f46}
.badge-unchecked{background:#f3f4f6;color:#4b5563}
.badge-checked{background:#d1fae5;color:#065f46}
.badge-issue{background:#fee2e2;color:#991b1b}
.empty{text-align:center;padding:28px 12px;color:var(--muted);font-size:13px}

/* 列表 */
.list{display:flex;flex-direction:column;gap:10px}
.li{display:flex;align-items:center;gap:12px;padding:12px;background:#fafaf3;border-radius:12px;transition:.15s}
.li:hover{background:#f0ede4}
.li .thumb{width:54px;height:54px;border-radius:10px;background:var(--pale);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;cursor:pointer}
.li .meta{flex:1;min-width:0}
.li .name{font-size:14px;font-weight:500}
.li .desc{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .badges{display:flex;gap:6px;margin-top:4px}
.li .ops{display:flex;gap:4px;flex-shrink:0}
.icon-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:6px;border-radius:8px;transition:.2s;color:var(--muted)}
.icon-btn:hover{background:rgba(0,0,0,.06);color:var(--text)}
.icon-btn.del{color:var(--red)}
.icon-btn.del:hover{background:#fee2e2}

/* 检查表样式 */
.check-item{display:flex;align-items:center;gap:12px;padding:12px;background:#fafaf3;border-radius:12px;transition:.2s;cursor:default}
.check-item:hover{background:#f0ede4}
.check-item.checked{opacity:.4}
.check-item.checked .ci-title{text-decoration:line-through;color:var(--muted)}
.check-item.checked .ci-note{color:var(--muted)}
.check-box{width:24px;height:24px;border:2px solid var(--border);border-radius:6px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s;flex-shrink:0;font-size:14px;background:#fff}
.check-box:hover{border-color:var(--primary);transform:scale(1.05)}
.check-box.done{background:var(--primary);border-color:var(--primary);color:#fff}
.ci-body{flex:1;min-width:0}
.ci-title{font-size:14px;font-weight:500}
.ci-note{font-size:12px;color:var(--muted);margin-top:2px}
.check-done-msg{text-align:center;padding:20px;font-size:15px;color:var(--primary);font-weight:600;background:#d1fae5;border-radius:12px;margin-bottom:12px}
.check-reset-btn{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;cursor:pointer;font-family:inherit}

/* 进度条 */
.progress-bar{height:8px;background:#f0ede4;border-radius:4px;margin:10px 0;overflow:hidden}
.progress-bar .fill{height:100%;background:var(--primary);border-radius:4px;transition:width .4s}

/* 统计卡片 */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:#fafaf3;border-radius:12px;padding:14px;text-align:center}
.stat .num{font-size:24px;font-weight:700;color:var(--primary)}
.stat .label{font-size:12px;color:var(--muted);margin-top:2px}

/* 设置 */
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}
.setting-row:last-child{border-bottom:none}
.setting-row .label{font-size:14px}
.mod-card{background:#fafaf3;border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.mod-card .mod-icon{font-size:20px;width:32px;text-align:center}
.mod-card .mod-info{flex:1;min-width:0}
.mod-card .mod-name{font-size:14px;font-weight:500}
.mod-card .mod-type{font-size:11px;color:var(--muted)}

/* 种子内容编辑 */
.seed-editor{background:#fafaf3;border-radius:12px;padding:12px;margin-top:8px}
.seed-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(0,0,0,.04)}
.seed-row:last-child{border-bottom:none}
.seed-input{padding:6px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
.seed-input:focus{outline:none;border-color:var(--primary)}
.seed-note{width:120px}
.seed-title{flex:1}

/* 管理者仪表盘 */
.dash-user-row{display:flex;align-items:center;padding:12px;background:#fafaf3;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.15s}
.dash-user-row:hover{background:#f0ede4}
.dash-user-row .user-avatar{width:40px;height:40px;border-radius:10px;background:var(--pale);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.dash-user-row .user-info{flex:1;min-width:0;margin-left:12px}
.dash-user-row .user-name{font-size:14px;font-weight:500}
.dash-user-row .user-stats{font-size:12px;color:var(--muted);margin-top:2px}
.dash-user-row .user-pct{font-size:18px;font-weight:700;color:var(--primary);flex-shrink:0;margin-right:8px}
.section-title{font-size:13px;font-weight:600;color:var(--primary);margin-bottom:8px;margin-top:16px}
.user-detail-bar{height:6px;background:#f0ede4;border-radius:3px;margin:4px 0}

/* 管理者查看单个运营详情 */
.back-btn{background:none;border:none;cursor:pointer;font-size:14px;color:var(--primary);padding:4px 8px;margin-bottom:16px;font-family:inherit;display:inline-flex;align-items:center;gap:4px}

/* 用户管理 */
.user-mgmt-row{display:flex;align-items:center;padding:10px 12px;background:#fafaf3;border-radius:12px;margin-bottom:6px}
.user-mgmt-row .um-name{flex:1;font-size:14px}
.user-mgmt-row .um-role{font-size:12px;padding:2px 8px;border-radius:6px}
.um-role.operator{background:#dbeafe;color:#1e40af}
.um-role.manager{background:#d1fae5;color:#065f46}
.um-role-btn{background:#f0ede4;border:none;border-radius:8px;padding:4px 8px;font-size:12px;cursor:pointer;margin-left:6px}

/* 店铺标签 */
.store-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.store-tab{padding:8px 14px;border-radius:10px;background:#f0ede4;font-size:13px;cursor:pointer;transition:.2s;font-weight:500}
.store-tab:hover{background:var(--pale)}
.store-tab.active{background:var(--primary);color:#fff}
.store-tab.done{background:#d1fae5;color:#065f46;border:1px solid #a7f3d0}
.store-tab.active.done{background:var(--primary);color:#fff}
.store-all-badge{font-size:11px;padding:2px 6px;border-radius:6px;margin-left:4px}
/* 店铺管理 */
.store-mgmt-card{display:flex;align-items:center;gap:6px;padding:6px 10px;background:#fafaf3;border-radius:10px;margin-bottom:4px;flex-wrap:wrap}
.store-mgmt-name{font-size:13px;font-weight:500;min-width:70px}
.store-op-chips{display:flex;gap:3px;flex-wrap:wrap;align-items:center;flex:1}
.store-op-chip{font-size:10px;padding:1px 6px;border-radius:5px;background:#dbeafe;color:#1e40af}
.store-op-chip.remove{background:#fee2e2;color:#991b1b;cursor:pointer}

@media(max-width:768px){
  .mobile-hd{display:flex}
  .sidebar{left:-100%;padding-top:64px;box-shadow:4px 0 20px rgba(0,0,0,.1)}
  .sidebar.open{left:0}
  .content{margin-left:0;padding:16px 14px}
  .stats{grid-template-columns:1fr 1fr}
}
@media(min-width:769px){.overlay{display:none!important}}
</style>
</head>
<body>

<!-- ========== 登录页 ========== -->
<div id="loginPage" class="login-page">
  <div class="login-box">
    <div class="emoji">🏢</div>
    <h1>凌琅科技工作台</h1>
    <div class="sub">团队协作版 · LingLang Team</div>
    <div id="loginError" class="login-error"></div>
    <input id="loginName" class="login-input name-field" placeholder="⚠️ 必填：你的名字" type="text">
    <div id="nameHint" class="name-required name-field">注册时名字为必填项，方便管理者识别</div>
    <select id="loginPosition" class="login-input name-field" style="display:none">
      <option value="">选择岗位（必填）</option>
      <option value="1688">1688 运营</option>
      <option value="shein">SHEIN 运营</option>
      <option value="temu">TEMU 运营</option>
    </select>
    <input id="loginEmail" class="login-input" placeholder="邮箱" type="email">
    <input id="loginPass" class="login-input" placeholder="密码（至少6位）" type="password">
    <button id="loginBtn" class="login-btn" onclick="doLogin()">登录</button>
    <div id="loginSwitch" class="login-switch">

// ========== 认证 ==========
function toggleAuthMode(){
  isRegisterMode=!isRegisterMode;
  $('#loginBtn').textContent=isRegisterMode?'注册':'登录';
  $('#loginSwitch').innerHTML=isRegisterMode?'已有账号？<a onclick="toggleAuthMode()">登录</a>':'还没有账号？<a onclick="toggleAuthMode()">注册</a>';
  $('#loginError').textContent='';
  // 显示/隐藏名字输入框和提示
  const nf=$('#loginName');
  const nh=$('#nameHint');
  nf.classList.toggle('name-field',!isRegisterMode);
  nh.classList.toggle('name-field',!isRegisterMode);
  nf.style.display=isRegisterMode?'block':'none';
  const pf=$('#loginPosition');
  pf.classList.toggle('name-field',!isRegisterMode);
  pf.style.display=isRegisterMode?'block':'none';
  if(!isRegisterMode) pf.value='';
  nh.style.display=isRegisterMode?'block':'none';
}

async function doLogin(){
  if(!sb) {
    $('#loginError').textContent = '⚠️ Supabase 初始化失败，请检查配置';
    return;
  }
  const email=$('#loginEmail').value.trim();
  const pass=$('#loginPass').value;
  const name=$('#loginName').value.trim();
  if(!email||!pass){$('#loginError').textContent='请输入邮箱和密码';return}
  if(isRegisterMode&&!name){$('#loginError').textContent='请输入你的名字';return}
  const position=$('#loginPosition').value;
  if(isRegisterMode&&!position){$('#loginError').textContent='请选择你的岗位';return}

  const btn=$('#loginBtn');
  btn.disabled=true;
  btn.textContent='处理中...';
  $('#loginError').textContent='';
  $('#loginError').style.color='var(--red)';

  try {
    let result;
    if(isRegisterMode){
      // 注册时传入 display_name 到 user metadata
      result=await sb.auth.signUp({email,password:pass,options:{data:{display_name:name,position:position}}});
      if(result.error){$('#loginError').textContent=result.error.message;btn.disabled=false;btn.textContent='注册';return}
      if(result.data?.user && !result.data.session) {
        $('#loginError').style.color='var(--orange)';
        $('#loginError').textContent='⚠️ 注册成功但需要邮箱确认。请去 Supabase Dashboard → Authentication → Providers → Email → 关闭 Confirm email。';
        btn.disabled=false;btn.textContent='注册';
        return;
      }
      if(result.data?.session) {
        currentUser=result.data.user;
        await loadProfile();
        enterApp();
        return;
      }
      $('#loginError').style.color='var(--primary)';
      $('#loginError').textContent='✅ 注册成功！请切换到登录模式登录';
      toggleAuthMode();
      btn.disabled=false;btn.textContent='登录';
      return;
    }else{
      result=await sb.auth.signInWithPassword({email,password:pass});
      if(result.error){$('#loginError').textContent=result.error.message;btn.disabled=false;btn.textContent='登录';return}
    }
    currentUser=result.data.user;
    await loadProfile();
    enterApp();
  } catch(e) {
    $('#loginError').textContent = '❌ 操作失败: ' + e.message;
    btn.disabled=false;
    btn.textContent=isRegisterMode?'注册':'登录';
  }
}

async function loadProfile(){
  const {data}=await sb.from('profiles').select('*').eq('id',currentUser.id).single();
  if(data){
    currentRole=data.role;
    currentUser.displayName=data.display_name;
    currentUser.position=data.position||'';
  }else{
    await new Promise(r=>setTimeout(r,1500));
    const {data:d2}=await sb.from('profiles').select('*').eq('id',currentUser.id).single();
      currentRole=d2.role;currentUser.displayName=d2.display_name;currentUser.position=d2.position||'';
  }
}

// ========== 个性化主题 ==========

  },

    pale:'#d4e2cf',sky:'#dbeafe',lilac:'#e9d5ff',cream:'#f5f2e8',slate:'#334155',rose:'#fce7f3'

};

function renderThemeCard(){
  const t=getUserTheme();
  const primaryOpts=Object.entries(THEME_PRESETS.primary).map(([k,v])=>
    `<div class="theme-swatch${t.primary===v?' selected':''}" style="background:${v}" onclick="saveThemePref('primary','${v}')" title="${k}"></div>`

      <div class="theme-label">卡片圆角</div>

function getUserTheme(){
  try{return JSON.parse(localStorage.getItem('user_theme')||'{}')}catch(e){return {}}
}

function applyUserTheme(){
  const t=getUserTheme();
  const root=document.documentElement.style;
  if(t.primary){
    root.setProperty('--primary',t.primary);
    root.setProperty('--primary-dk',shadeColor(t.primary,-15));
    root.setProperty('--light',shadeColor(t.primary,25));
  }
  if(t.sidebar){
    root.setProperty('--pale',t.sidebar);
    // 同时更新 cream 背景为侧边栏色的更浅版本
    root.setProperty('--cream',shadeColor(t.sidebar,85));
  }
  if(t.radius){
    root.setProperty('--card-radius',t.radius);
  }
  if(t.fontSize){
    root.setProperty('--base-font',t.fontSize);
    document.body.style.fontSize=t.fontSize;
  }
}

function shadeColor(hex,percent){
  let r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  r=Math.max(0,Math.min(255,r+Math.round(r*percent/100)));
  g=Math.max(0,Math.min(255,g+Math.round(g*percent/100)));
  b=Math.max(0,Math.min(255,b+Math.round(b*percent/100)));
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

function saveThemePref(key,val){
  const t=getUserTheme();
  if(val){t[key]=val}else{delete t[key]}
  localStorage.setItem('user_theme',JSON.stringify(t));
  applyUserTheme();
  // 刷新设置页选中状态
  if(activeModId==='my-settings'||activeModId==='settings'){
    renderContent();
  }
}

// ========== 加载模块 ==========
async function loadModules(){
  const {data}=await sb.from('modules').select('*').order('sort_order');
  modulesCache=data||[];
  // 按岗位过滤模块
  const myPosition=currentUser.position||'';
  if(currentRole==='operator' && myPosition){
    modulesCache=modulesCache.filter(m=>{
      const tp=(m.target_positions||'1688,shein,temu').split(',');
      return tp.includes(myPosition);
    });
  }
  // 加载店铺数据
  const {data:st}=await sb.from('stores').select('*').order('sort_order');
  storesCache=st||[];
  const {data:so}=await sb.from('store_operators').select('*');
  storeOpsCache=so||[];
  if(!activeModId) activeModId=modulesCache.find(m=>m.name==='运营每日工作')?.id||modulesCache[0]?.id||'';
  // 先初始化种子条目，再渲染（确保条目存在后再显示）
  await initModuleItems();
  renderSidebar();
  renderContent();
}

// ========== 种子条目初始化（核心逻辑） ==========
async function initModuleItems(){
  const today=TD();

  for(const mod of modulesCache){
    const rule=mod.module_rule||'normal';
    const seedStr=mod.seed_content;
    const seeds=seedStr?JSON.parse(seedStr):[];
    console.log(`[init] "${mod.name}" rule=${rule} seeds=${seeds.length} seedStr=${seedStr?'有':'空'}`);

    try{
    if(rule==='daily'){
      const useStores=mod.use_stores===true;
      if(useStores){
        // 按店铺创建每日种子条目
        const myStores=storesCache.filter(s=>storeOpsCache.some(so=>so.store_id===s.id && so.operator_id===currentUser.id));
        console.log(`[init] daily+stores "${mod.name}" 分配店铺 ${myStores.length} 个`);
        if(myStores.length===0){
          // 无分配店铺 — 不创建任何条目
          console.log(`[init] daily+stores "${mod.name}" 无店铺，跳过创建`);
          // 清理可能存在的旧 null-store 种子条目（查询+JS过滤方式，更可靠）
          const {data:oldItems}=await sb.from('items').select('id,store_id')
            .eq('module_id',mod.id).eq('user_id',currentUser.id).eq('is_seed',true);
          const nullIds=(oldItems||[]).filter(i=>!i.store_id).map(i=>i.id);
          if(nullIds.length>0){
            await sb.from('items').delete().in('id',nullIds);
            console.log(`[init] daily+stores "${mod.name}" 清理 ${nullIds.length} 条无店铺旧条目`);
          }
        }else{
          // 有分配店铺 — 先清理旧的 null-store 种子条目（JS过滤方式）
          const {data:oldItems}=await sb.from('items').select('id,store_id')
            .eq('module_id',mod.id).eq('user_id',currentUser.id).eq('is_seed',true);
          const nullIds=(oldItems||[]).filter(i=>!i.store_id).map(i=>i.id);
          if(nullIds.length>0){
            await sb.from('items').delete().in('id',nullIds);
            console.log(`[init] daily+stores "${mod.name}" 清理 ${nullIds.length} 条无店铺旧条目`);
          }

          for(const store of myStores){
            const {data:existing,error:e1}=await sb.from('items').select('id,title')
              .eq('module_id',mod.id).eq('user_id',currentUser.id)
              .eq('date',today).eq('is_seed',true).eq('store_id',store.id);
            if(e1){console.error(`[init] daily+stores店铺"${store.name}"查询失败:`,e1);continue;}
            const exCount=existing?.length||0;

            if(exCount===0 && seeds.length>0){
              // 无条目 — 创建全部
              const inserts=seeds.map(s=>({module_id:mod.id,user_id:currentUser.id,title:s.title,note:s.note||'',badge:'progress',date:today,is_seed:true,store_id:store.id}));
              const {error:e2}=await sb.from('items').insert(inserts);
              if(e2){console.error(`[init] daily+stores店铺"${store.name}"插入失败:`,e2);continue;}
              console.log(`[init] daily+stores "${mod.name}" 店铺"${store.name}" 创建 ${inserts.length} 条`);
            }else if(exCount>seeds.length){
              // 有重复条目！按 title 去重，每个 title 只保留一条
              console.warn(`[init] daily+stores "${mod.name}" 店铺"${store.name}" 检测到重复：${exCount}条 > ${seeds.length}条种子，开始去重`);
              const titleMap={};
              (existing||[]).forEach(i=>{
                if(!titleMap[i.title]) titleMap[i.title]=[];
                titleMap[i.title].push(i.id);
              });
              const toDelete=[];
              Object.values(titleMap).forEach(ids=>{
                // 保留第一条，删除其余
                toDelete.push(...ids.slice(1));
              });
              // 同时删除没有任何 title 匹配的孤儿条目
              const seedTitles=seeds.map(s=>s.title);
              (existing||[]).forEach(i=>{
                if(!seedTitles.includes(i.title) && !toDelete.includes(i.id)){
                  toDelete.push(i.id);
                }
              });
              if(toDelete.length>0){
                await sb.from('items').delete().in('id',toDelete);
                console.log(`[init] daily+stores "${mod.name}" 店铺"${store.name}" 去重删除 ${toDelete.length} 条`);
              }
              // 补充缺失的种子条目
              const remainingTitles=(existing||[]).filter(i=>!toDelete.includes(i.id)).map(i=>i.title);
              const missingSeeds=seeds.filter(s=>!remainingTitles.includes(s.title));
              if(missingSeeds.length>0){
                const inserts=missingSeeds.map(s=>({module_id:mod.id,user_id:currentUser.id,title:s.title,note:s.note||'',badge:'progress',date:today,is_seed:true,store_id:store.id}));
                await sb.from('items').insert(inserts);
                console.log(`[init] daily+stores "${mod.name}" 店铺"${store.name}" 补充 ${inserts.length} 条缺失`);
              }
            }else{
              // 正常数量 — 检查是否有缺失的种子
              const existingTitles=(existing||[]).map(i=>i.title);
              const missingSeeds=seeds.filter(s=>!existingTitles.includes(s.title));
              if(missingSeeds.length>0){
                const inserts=missingSeeds.map(s=>({module_id:mod.id,user_id:currentUser.id,title:s.title,note:s.note||'',badge:'progress',date:today,is_seed:true,store_id:store.id}));
                await sb.from('items').insert(inserts);
                console.log(`[init] daily+stores "${mod.name}" 店铺"${store.name}" 补充 ${inserts.length} 条缺失`);
              }else{
                console.log(`[init] daily+stores "${mod.name}" 店铺"${store.name}" 种子完整 (${exCount} 条)`);
              }
            }
          }
        }
      }else{
        // 原始无店铺逻辑
        const {data:existing,error:e1}=await sb.from('items').select('id')
          .eq('module_id',mod.id).eq('user_id',currentUser.id)
          .eq('date',today).eq('is_seed',true);
        if(e1){console.error('[init] daily查询失败:',e1);continue;}
        if(!existing||existing.length===0){
          if(seeds.length>0){
            const inserts=seeds.map(s=>({module_id:mod.id,user_id:currentUser.id,title:s.title,note:s.note||'',badge:'progress',date:today,is_seed:true}));
            const {error:e2}=await sb.from('items').insert(inserts);
            if(e2){console.error('[init] daily插入失败:',e2);continue;}
            console.log(`[init] daily "${mod.name}" 创建 ${inserts.length} 条`);
          }
        }else{console.log(`[init] daily "${mod.name}" 已有 ${existing.length} 条`);}
      }

    }else if(rule==='checklist'){
      // 检查表：不按店铺分页，直接创建种子条目
      if(seeds.length>0){
        const {data:existing,error:e3}=await sb.from('items').select('id,title,is_seed')
          .eq('module_id',mod.id).eq('user_id',currentUser.id);
        if(e3){console.error('[init] checklist查询失败:',e3);continue;}
        const existingSeeds=(existing||[]).filter(i=>i.is_seed);
        const missingSeeds=seeds.filter(s=>!existingSeeds.some(e=>e.title===s.title));
        if(missingSeeds.length>0){
          const inserts=missingSeeds.map(s=>({module_id:mod.id,user_id:currentUser.id,title:s.title,note:s.note||'',badge:'unchecked',is_seed:true}));
          const {error:e4}=await sb.from('items').insert(inserts);
          if(e4){console.error('[init] checklist插入失败:',e4);continue;}
          console.log(`[init] checklist "${mod.name}" 补充 ${inserts.length} 条`);
        }
      }

      // 新一天重置
      const lastReset=localStorage.getItem('cl_reset_'+mod.id+'_'+currentUser.id);
      if(lastReset!==today){
        const {error:e5}=await sb.from('items').update({badge:'unchecked'})
          .eq('module_id',mod.id).eq('user_id',currentUser.id).in('badge',['checked']);
        if(e5){console.error('[init] checklist重置失败:',e5);}else{
          localStorage.setItem('cl_reset_'+mod.id+'_'+currentUser.id,today);
        }
      }
    }
    }catch(err){console.error(`[init] "${mod.name}" 异常:`,err);}
  }
}

function renderSidebar(){
  const roleLabel=currentRole==='manager'?'管理者':'运营';
  const roleCls=currentRole==='manager'?'manager':'';
  const displayName=currentUser.displayName||currentUser.email||'';
  const posLabel={'1688':'1688运营','shein':'SHEIN运营','temu':'TEMU运营'}[currentUser.position]||'';
  $('#sbHd').innerHTML=`
    <div class="emoji">🏢</div>
    <div class="title">凌琅科技</div>
    <div class="sub">${esc(displayName)} · ${roleLabel}${posLabel?' · '+posLabel:''}</div>
    <div class="role-badge ${roleCls}">${roleLabel}</div>
    <button class="logout-link" onclick="doLogout()">退出登录 / 切换账号</button>
  `;

  const menu=$('#menu');
  menu.innerHTML='';
  if(currentRole==='operator'){
    modulesCache.forEach(mod=>{
      if(mod.module_rule==='normal'&&mod.name==='设置') return;
      menu.innerHTML+=`<div class="mi${activeModId===mod.id?' active':''}" data-mid="${mod.id}"><span class="icon">${mod.icon}</span><span class="label">${esc(mod.name)}</span></div>`;
    });
    menu.innerHTML+=`<div class="mi${activeModId==='my-settings'?' active':''}" data-mid="my-settings"><span class="icon">⚙️</span><span class="label">我的设置</span></div>`;
  }else{
    menu.innerHTML+=`<div class="mi${activeModId==='dashboard'?' active':''}" data-mid="dashboard"><span class="icon">📊</span><span class="label">团队总览</span></div>`;
    modulesCache.forEach(mod=>{
      if(mod.name==='设置') return;
      menu.innerHTML+=`<div class="mi${activeModId===mod.id?' active':''}" data-mid="${mod.id}"><span class="icon">${mod.icon}</span><span class="label">${esc(mod.name)}</span></div>`;
    });
    menu.innerHTML+=`<div class="mi${activeModId==='settings'?' active':''}" data-mid="settings"><span class="icon">⚙️</span><span class="label">系统设置</span></div>`;
  }

  $$('.mi').forEach(it=>{
    it.addEventListener('click',()=>{
      $$('.mi').forEach(i=>i.classList.remove('active'));
      it.classList.add('active');
      activeModId=it.dataset.mid;
      viewingUserId=null;
      activeStoreId='all'; // 切换模块时重置店铺选择
      renderContent();
      const target=$('#mod_'+activeModId);
      if(target) target.classList.add('active');
      $('#mTitle').textContent=it.querySelector('.icon').textContent+' '+it.querySelector('.label').textContent;
      if(window.innerWidth<=768) toggleSidebar();
    });

async function loadDashboardData(){
  const {data:operators}=await sb.from('profiles').select('*').eq('role','operator');
  if(!operators) return;
  $('#dsTotalOps').textContent=operators.length;

  const today=TD();
  // 获取今日所有运营的 items（管理者可以看到所有）
  const opIds=operators.map(o=>o.id);
  const {data:allItems}=await sb.from('items').select('user_id, badge, module_id, is_seed, date, store_id')
    .in('user_id',opIds);

  // 只看今日的 daily 模块数据
  const dailyMods=modulesCache.filter(m=>m.module_rule==='daily');
  const dailyModIds=dailyMods.map(m=>m.id);
  const dailyItems=(allItems||[]).filter(i=>dailyModIds.includes(i.module_id));

  let totalDone=0, totalPct=0, opCount=0;

  const dashList=$('#dashList');
  dashList.innerHTML='';
  operators.forEach(op=>{
    const myItems=dailyItems.filter(i=>i.user_id===op.id && i.date===today);
    const done=myItems.filter(i=>i.badge==='done').length;
    const total=myItems.length;
    const pct=total?Math.round(done/total*100):0;
    if(total>0){totalPct+=pct;opCount++;}
    totalDone+=done;

    const posLabel={'1688':'1688运营','shein':'SHEIN运营','temu':'TEMU运营'}[op.position]||'';
    dashList.innerHTML+=`<div class="dash-user-row" onclick="viewUserDetail('${op.id}','${esc(op.display_name)}')">
      <div class="user-avatar">${op.display_name?.charAt(0)||'👤'}</div>
      <div class="user-info">
        <div class="user-name">${esc(op.display_name||op.id.slice(0,8))}${posLabel?' <span style="font-size:10px;color:var(--muted)">('+posLabel+')</span>':''}</div>
        <div class="user-stats">${done}/${total} 已完成 · ${today}</div>
        <div class="user-detail-bar"><div style="height:100%;width:${pct}%;background:var(--primary);border-radius:3px;transition:width .4s"></div></div>
      </div>
      <div class="user-pct">${pct}%</div>
    </div>`;
  });

  $('#dsAvgPct').textContent=opCount?Math.round(totalPct/opCount)+'%':'0%';
  $('#dsTodayDone').textContent=totalDone;
}

async function viewUserDetail(userId, userName){
  viewingUserId=userId;
  const today=TD();

  // 获取该运营今日所有模块的数据
  const {data:allItems}=await sb.from('items').select('*').eq('user_id',userId);

  const area=$('#contentArea');
  let html=`<section class="module active">
    <button class="back-btn" onclick="backToDashboard()">← 返回总览</button>
    <div class="card">
      <div class="card-title"><span class="emoji">👤</span>${esc(userName)} 的工作详情</div>`;

  // 遍历每个模块展示
  for(const mod of modulesCache){
    if(mod.name==='设置') continue;
    const rule=mod.module_rule||'normal';
    let modItems;
    if(rule==='daily'){
      modItems=(allItems||[]).filter(i=>i.module_id===mod.id && i.date===today);
    }else if(rule==='checklist'){
      modItems=(allItems||[]).filter(i=>i.module_id===mod.id);
    }else{
      modItems=(allItems||[]).filter(i=>i.module_id===mod.id);
    }
    if(modItems.length===0) continue;

    if(rule==='checklist'){
      const checked=modItems.filter(i=>i.badge==='checked').length;
      const unchecked=modItems.filter(i=>i.badge==='unchecked').length;
      const total=modItems.length;
      html+=`<div style="margin-top:16px"><text class="section-title">${mod.icon} ${esc(mod.name)}</text>`;
      html+=`<div style="font-size:12px;color:var(--muted);margin-bottom:8px">${checked}/${total} 已检查</div>`;
      modItems.forEach(it=>{
        const isC=it.badge==='checked';
        html+=`<div class="check-item${isC?' checked':''}" style="margin-bottom:6px">
          <div class="check-box${isC?' done':''}">${isC?'✓':''}</div>
          <div class="ci-body"><div class="ci-title">${esc(it.title)}</div>${it.note?`<div class="ci-note">${esc(it.note)}</div>`:''}</div>
        </div>`;
      });
      html+=`</div>`;
    }else{
      const done=modItems.filter(i=>i.badge==='done').length;
      const prog=modItems.filter(i=>i.badge==='progress').length;
      const total=modItems.length;
      const pct=total?Math.round(done/total*100):0;
      const cycles=mod.badge_cycle?mod.badge_cycle.split(','):['progress','done'];
      const labels=mod.badge_labels?mod.badge_labels.split(','):['进行中','已完成'];
      html+=`<div style="margin-top:16px"><text class="section-title">${mod.icon} ${esc(mod.name)}</text>`;
      html+=`<div class="stats" style="margin-bottom:8px">
        <div class="stat"><div class="num" style="color:var(--blue)">${prog}</div><div class="label">进行中</div></div>
        <div class="stat"><div class="num" style="color:var(--primary)">${done}</div><div class="label">已完成</div></div>
      </div>`;
      html+=`<div class="progress-bar"><div class="fill" style="width:${pct}%"></div></div>`;
      modItems.forEach(it=>{
        const bc=badgeClassMap[it.badge]||'badge-pending';
        const bt=labels[cycles.indexOf(it.badge)]||it.badge;
        const ti=thumbIcons[it.badge]||mod.icon;
        const isDone=it.badge==='done';
        html+=`<div class="li" style="${isDone?'opacity:.7':''};margin-bottom:6px">
          <div class="thumb">${ti}</div>
          <div class="meta"><div class="name" style="${isDone?'text-decoration:line-through;color:var(--muted)':''}">${esc(it.title)}</div>
          ${it.note?`<div class="desc">${esc(it.note)}</div>`:''}
          <div class="badges"><span class="badge ${bc}">${esc(bt)}</span></div></div>
        </div>`;
      });
      html+=`</div>`;
    }
  }
  html+=`</div></section>`;
  area.innerHTML=html;
}

  });

  const modList=$('#modMgmtList');
  modList.innerHTML='';
  modulesCache.forEach(mod=>{
    if(mod.name==='设置') return;
    const typeLabel=mod.type==='list'?'列表':'文本';
    const ruleLabel={'normal':'普通','daily':'每日刷新','checklist':'检查表'}[mod.module_rule||'normal']||'普通';
    modList.innerHTML+=`<div class="mod-card">
      <div class="mod-icon">${mod.icon}</div>
      <div class="mod-type">${typeLabel} · 规则：${ruleLabel}${mod.target_positions&&mod.target_positions!=='1688,shein,temu'?' · 适用：'+mod.target_positions:''}</div>

  const stList=$('#storeMgmtList');
  stList.innerHTML='';

  if(storesCache.length===0){
    stList.innerHTML='<div style="font-size:13px;color:var(--muted);padding:8px 0">暂无店铺，点击上方按钮添加</div>';
  }
  storesCache.forEach(st=>{
    const assignedOps=storeOpsCache.filter(so=>so.store_id===st.id);
    const opChips=assignedOps.map(so=>{
      const op=ops.find(o=>o.id===so.operator_id);

      return `<span class="store-op-chip remove" onclick="removeOpFromStore('${st.id}','${so.operator_id}')">${esc(opName)} ✕</span>`;

    const unassignedOps=ops.filter(o=>!assignedOps.some(so=>so.operator_id===o.id));
    let assignArea='';
    if(unassignedOps.length>0){
      assignArea=`<select onchange="if(this.value)assignOpToStore('${st.id}',this.value);this.value=''" style="font-size:10px;border-radius:5px;border:1px solid var(--border);padding:1px 4px;background:var(--pale);cursor:pointer">

        ${unassignedOps.map(o=>`<option value="${o.id}">${esc(o.display_name||o.id.slice(0,8))}</option>`).join('')}
      </select>`;
    }else if(ops.length===0){
      assignArea='<span style="font-size:10px;color:var(--muted)">无运营可分配</span>';
    }else{
      assignArea='<span style="font-size:11px;color:var(--muted)">所有运营已分配</span>';
    }
    stList.innerHTML+=`<div class="store-mgmt-card">
      <span class="store-mgmt-name">🏪 ${esc(st.name)}</span>
      <div class="store-op-chips">${opChips}${assignArea}</div>
      <button class="btn btn-sm btn-r" onclick="removeStore('${st.id}')">✕</button>
    </div>`;
  });
}

async function addModule(){
  const name=prompt('模块名称：');if(!name) return;
  const icon=prompt('图标（emoji）：','📌');
  const type=prompt('类型：1=列表 2=文本','1');
  const mt=type==='2'?'text':'list';
  const rule=prompt('选择模块规则：\n1 = 普通（如今日计划，自由增删，不按日期刷新）\n2 = 每日刷新（如运营每日工作，种子条目每天重置）\n3 = 检查表（如新品上架检查表，不可删除，打勾变暗）','1');
  const ruleVal={'1':'normal','2':'daily','3':'checklist'}[rule]||'normal';
  const targetPos=prompt('该模块适用于哪些岗位？\n1 = 仅1688运营\n2 = 仅SHEIN运营\n3 = 仅TEMU运营\n4 = 全部岗位（默认）','4');
  const tpMap={'1':'1688','2':'shein','3':'temu','4':'1688,shein,temu'};
  const targetPositions=tpMap[targetPos]||'1688,shein,temu';
  const useStores=mt==='list' && ruleVal==='daily'?prompt('是否需要按店铺分页？\n1 = 是（每个店铺独立跟踪）\n2 = 否','2')==='1':false;
  const bc=mt==='list'?(ruleVal==='checklist'?'unchecked,checked':'progress,done'):'';
  const bl=mt==='list'?(ruleVal==='checklist'?'未检查,已检查':'进行中,已完成'):'';
  const maxSort=modulesCache.reduce((mx,m)=>Math.max(mx,m.sort_order||0),0);
  await sb.from('modules').insert({icon:icon||'📌',name:name.trim(),type:mt,module_rule:ruleVal,target_positions:targetPositions,use_stores:useStores,badge_cycle:bc,badge_labels:bl,sort_order:maxSort+1});
  await loadModules();
  activeModId='settings';renderSidebar();renderContent();
}

async function saveSeedContent(modId){
  const rows=$$('#seedEditorList .seed-row');
  const seeds=[];
  rows.forEach(r=>{
    const title=r.querySelector('.seed-title').value.trim();
    const note=r.querySelector('.seed-note').value.trim();
    if(title) seeds.push({title,note});
  });
  await sb.from('modules').update({seed_content:JSON.stringify(seeds)}).eq('id',modId);
  alert('✅ 种子内容已保存！运营下次打开应用时会同步更新。');
  // 对于 daily 模块，需要同步给所有运营
  await syncSeedToAllOperators(modId);
  backToSettings();
}

// 同步种子内容到所有运营
async function syncSeedToAllOperators(modId){
  const mod=modulesCache.find(m=>m.id===modId);
  if(!mod) return;
  const rule=mod.module_rule;
  const seeds=mod.seed_content?JSON.parse(mod.seed_content):[];
  if(seeds.length===0) return;

  const {data:operators}=await sb.from('profiles').select('id').eq('role','operator');
  if(!operators) return;

  const today=TD();
  for(const op of operators){
    // 对于 daily 模块：删除旧的种子条目，创建新的
    if(rule==='daily'){
      await sb.from('items').delete()
        .eq('module_id',modId)
        .eq('user_id',op.id)
        .eq('is_seed',true)
        .eq('date',today);
      const inserts=seeds.map((s,i)=>({
        module_id:modId,user_id:op.id,title:s.title,note:s.note||'',
        badge:'pending',date:today,is_seed:true
      }));
      await sb.from('items').insert(inserts);
    }
    // 对于 checklist 模块：只添加缺失的条目
    else if(rule==='checklist'){
      const {data:existing}=await sb.from('items').select('title')
        .eq('module_id',modId).eq('user_id',op.id).eq('is_seed',true);
      const existingTitles=(existing||[]).map(e=>e.title);
      const missing=seeds.filter(s=>!existingTitles.includes(s.title));
      if(missing.length>0){
        const inserts=missing.map(s=>({
          module_id:modId,user_id:op.id,title:s.title,note:s.note||'',
          badge:'unchecked',is_seed:true
        }));
        await sb.from('items').insert(inserts);
      }
    }
  }
}

// ========== 加载列表数据 ==========
async function loadListData(mod){
  const rule=mod.module_rule||'normal';
  const today=TD();
  const cycles=mod.badge_cycle?mod.badge_cycle.split(','):['pending','progress','done'];
  const labels=mod.badge_labels?mod.badge_labels.split(','):cycles;
  const useStores=mod.use_stores===true;

  if(rule==='checklist'){
    await loadChecklistData(mod);
    return;
  }

  if(currentRole==='operator'){
    // 运营只看自己的数据
    let query=sb.from('items').select('*').eq('module_id',mod.id).eq('user_id',currentUser.id);
    if(rule==='daily'){
      query=query.eq('date',today);
    }
    if(useStores){
      // 启用店铺分页 — 确定当前查看的店铺
      const myStores=storesCache.filter(s=>storeOpsCache.some(so=>so.store_id===s.id && so.operator_id===currentUser.id));
      if(myStores.length===0){
        // 无店铺，不查数据
        renderOperatorList(mod,[],cycles,labels,today,rule);
        return;
      }
      let storeId=activeStoreId;
      if(!storeId || storeId==='all' || !myStores.some(s=>s.id===storeId)){
        storeId=myStores[0].id; // 默认第一个店铺
        activeStoreId=storeId;
      }
      query=query.eq('store_id',storeId);
    }
    const {data:items}=await query;
    renderOperatorList(mod,items||[],cycles,labels,today,rule);
  }else{
    // 管理者看所有人的汇总
    let query=sb.from('items').select('*').eq('module_id',mod.id);
    if(rule==='daily'){
      query=query.eq('date',today);
    }
    const {data:items}=await query;
    const {data:ops}=await sb.from('profiles').select('id,display_name,position').eq('role','operator');
    renderManagerList(mod,items||[],ops||[],cycles,labels,today);
  }
}

// ========== 加载检查表数据 ==========
async function loadChecklistData(mod){
  try{
  if(currentRole==='operator'){
    let query=sb.from('items').select('*').eq('module_id',mod.id).eq('user_id',currentUser.id);
    const {data:items,error}=await query;
    if(error){console.error('[loadChecklist] 运营查询失败:',error);return;}
    const list=items||[];
    if(list.length===0){
      await initModuleItems();
      const {data:items2,error:e2}=await sb.from('items').select('*')
        .eq('module_id',mod.id).eq('user_id',currentUser.id);
      if(e2||!items2){console.error('[loadChecklist] 二次查询失败:',e2);return;}
      renderChecklist(mod,items2||[]);
    }else{
      renderChecklist(mod,list);
    }
  }else{
    // 管理者看所有运营的检查表汇总
    const {data:ops,error:e1}=await sb.from('profiles').select('id,display_name,position').eq('role','operator');
    let query=sb.from('items').select('*').eq('module_id',mod.id);
    const {data:allItems,error:e2}=await query;
    if(e1||e2){console.error('[loadChecklist] 管理者查询失败:',e1,e2);return;}
    renderManagerChecklist(mod,allItems||[],ops||[]);
  }
  }catch(err){console.error('[loadChecklist] 异常:',err);}
}

async function toggleCheck(itemId, modId){
  const {data:item,error:e1}=await sb.from('items').select('badge').eq('id',itemId).single();
  if(e1||!item){console.error('[toggleCheck] 查询失败:',e1);return;}
  const newBadge=item.badge==='checked'?'unchecked':'checked';
  const {error:e2}=await sb.from('items').update({badge:newBadge}).eq('id',itemId);
  if(e2){console.error('[toggleCheck] 更新失败:',e2);return;}
  const mod=modulesCache.find(m=>m.id===modId);
  if(mod) loadChecklistData(mod);
}

    .eq('module_id',modId).eq('user_id',currentUser.id);

}

      <div class="user-avatar">${op.display_name?.charAt(0)||'👤'}</div>
      <div class="user-info">
        <div class="user-name">${esc(op.display_name||op.id.slice(0,8))}${posLabel?' <span style="font-size:10px;color:var(--muted)">('+posLabel+')</span>':''}</div>
        <div class="user-stats">${done}/${total} · ${today}</div>
        <div class="user-detail-bar"><div style="height:100%;width:${opPct}%;background:var(--primary);border-radius:3px"></div></div>
      </div>
      <div class="user-pct">${opPct}%</div>
    </div>`;
  });

  // 下方：模块默认内容（种子条目）
  const seeds=mod.seed_content?JSON.parse(mod.seed_content):[];
  if(seeds.length>0){
    html+='<div style="margin-top:20px;border-top:1px solid var(--border);padding-top:16px"><div class="card-sub" style="font-weight:600">📋 模块默认内容</div></div>';
    seeds.forEach(s=>{
      html+=`<div class="li">
        <div class="thumb">${mod.icon}</div>
        <div class="meta"><div class="name">${esc(s.title)}</div>
        ${s.note?`<div class="desc">${esc(s.note)}</div>`:''}
        </div>
      </div>`;
    });
  }

  listEl.innerHTML=html;
}

// ========== 列表操作 ==========
async function addItem(modId){
  const v=$('#addInput_'+modId).value.trim();if(!v) return;
  const bEl=$('#addBadge_'+modId);
  const b=bEl?bEl.value:'progress';
  const mod=modulesCache.find(m=>m.id===modId);
  const rule=mod.module_rule||'normal';
  const useStores=mod.use_stores===true;
  const itemData={
    module_id:modId,user_id:currentUser.id,title:v,note:'',badge:b,
    is_seed:false
  };
  if(rule==='daily'){
    itemData.date=TD();
  }
  if(useStores){
    // 启用店铺分页 — 确定当前店铺
    const myStores=storesCache.filter(s=>storeOpsCache.some(so=>so.store_id===s.id && so.operator_id===currentUser.id));
    let storeId=activeStoreId;
    if(!storeId || storeId==='all' || !myStores.some(s=>s.id===storeId)){
      storeId=myStores[0]?.id||null;
    }
    itemData.store_id=storeId;
  }
  await sb.from('items').insert(itemData);
  $('#addInput_'+modId).value='';
  loadListData(mod);
}

async function cycleBadge(modId,itemId){
  const mod=modulesCache.find(m=>m.id===modId);
  const rule=mod.module_rule||'normal';
  if(rule==='checklist') return; // 检查表用 toggleCheck，不走 cycleBadge
  const cycles=mod.badge_cycle.split(',');
  const {data:item}=await sb.from('items').select('badge').eq('id',itemId).single();
  if(!item) return;
  const cur=cycles.indexOf(item.badge);
  const next=cycles[(cur+1)%cycles.length];
  await sb.from('items').update({badge:next}).eq('id',itemId);
  loadListData(mod);
}

async function editItem(itemId){
  const {data:item}=await sb.from('items').select('*').eq('id',itemId).single();
  if(!item) return;
  const newT=prompt('编辑条目：',item.title);
  if(newT!==null&&newT.trim()){
    const newN=prompt('备注：',item.note||'');
    await sb.from('items').update({title:newT.trim(),note:newN||''}).eq('id',itemId);
    const mod=modulesCache.find(m=>m.id===item.module_id);
    if(mod) loadListData(mod);
  }
}

async function delItem(itemId,modId){
  // 检查模块规则
  const mod=modulesCache.find(m=>m.id===modId);
  const rule=mod.module_rule||'normal';
  if(rule==='checklist'){
    alert('检查表条目不可删除');
    return;
  }
  if(!confirm('删除此条目？')) return;
  await sb.from('items').delete().eq('id',itemId);
  if(mod) loadListData(mod);
}

// ========== 文本型模块 ==========
function renderTextModule(mod){
  return `<section class="module" id="mod_${mod.id}">
    <div class="card">
      <div class="card-title"><span class="emoji">${mod.icon}</span>${esc(mod.name)}</div>
      <div style="margin-bottom:12px">
        <label style="font-size:13px;font-weight:600;color:var(--primary);display:block;margin-bottom:6px">✅ 做得好的</label>
        <textarea class="textarea" id="textGood_${mod.id}" placeholder="哪些事情做得好？" style="min-height:80px" oninput="saveText('${mod.id}')"></textarea>
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:13px;font-weight:600;color:var(--orange);display:block;margin-bottom:6px">🔧 要改进的</label>
        <textarea class="textarea" id="textBad_${mod.id}" placeholder="哪些地方需要改进？" style="min-height:80px" oninput="saveText('${mod.id}')"></textarea>
      </div>
      <div>
        <label style="font-size:13px;font-weight:600;color:var(--red);display:block;margin-bottom:6px">🎯 下周重点</label>
        <textarea class="textarea" id="textFocus_${mod.id}" placeholder="下周最重要的事" style="min-height:80px" oninput="saveText('${mod.id}')"></textarea>
      </div>
    </div>
  </section>`;
}

async function loadTextData(mod){
  const {data:tc}=await sb.from('text_content').select('*').eq('module_id',mod.id).eq('user_id',currentUser.id).maybeSingle();
  if(tc){
    $('#textGood_'+mod.id).value=tc.good||'';
    $('#textBad_'+mod.id).value=tc.bad||'';
    $('#textFocus_'+mod.id).value=tc.focus||'';
    window['_tcId_'+mod.id]=tc.id;
  }else{
    const {data:newTc}=await sb.from('text_content').insert({module_id:mod.id,user_id:currentUser.id,good:'',bad:'',focus:''}).select().single();
    if(newTc) window['_tcId_'+mod.id]=newTc.id;
  }
}

async function saveText(modId){
  const good=$('#textGood_'+modId)?.value||'';
  const bad=$('#textBad_'+modId)?.value||'';
  const focus=$('#textFocus_'+modId)?.value||'';
  const tcId=window['_tcId_'+modId];
  if(tcId){
    await sb.from('text_content').update({good,bad,focus}).eq('id',tcId);
  }else{
    const {data:newTc}=await sb.from('text_content').insert({module_id:modId,user_id:currentUser.id,good,bad,focus}).select().single();
    if(newTc) window['_tcId_'+modId]=newTc.id;
  }
}

// ========== 启动流程 ==========
sb?.auth.onAuthStateChange(async(event,session)=>{
  if(session?.user){
    // 向服务器验证 token 是否仍然有效（用户可能已在 Dashboard 被删除）
    const {data:uData,error:uErr}=await sb.auth.getUser();
    if(uErr||!uData?.user){
      await sb.auth.signOut();
      currentUser=null;
      $('#loginPage').style.display='flex';
      $('#mainApp').style.display='none';
      return;
    }
    currentUser=session.user;
    await loadProfile();
    enterApp();
  }else{
    currentUser=null;
    $('#loginPage').style.display='flex';
    $('#mainApp').style.display='none';
  }
});

// 检查是否已有登录态
(async()=>{
  if(!sb) return;
  const {data:{session}}=await sb.auth.getSession();
  if(session?.user){
    // 向服务器验证 token 是否仍然有效（用户可能已在 Dashboard 被删除）
    const {data:uData,error:uErr}=await sb.auth.getUser();
    if(uErr||!uData?.user){
      // token 无效 → 清除旧 session，显示登录页
      await sb.auth.signOut();
      $('#loginPage').style.display='flex';
      $('#mainApp').style.display='none';
      return;
    }
    currentUser=uData.user;
    await loadProfile();
    enterApp();
  }
})();
</script>
